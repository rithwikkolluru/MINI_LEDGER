services:
  mysql:
    image: mysql:8.4
    container_name: miniledger-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-miniledger}
      MYSQL_USER: ${MYSQL_USER:-miniledger}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-miniledger_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
      TZ: UTC
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - miniledger_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  miniledger_mysql_data:
